apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.db.name }}
  name: {{ .Values.db.name }}
spec:
  replicas: {{ .Values.db.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.db.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.name }}
    spec:
      containers:
        - name: {{ .Values.db.name }}
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.containerPort }}
          env:
            {{- toYaml .Values.db.env | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.db.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.db.volumes | nindent 8 }}
