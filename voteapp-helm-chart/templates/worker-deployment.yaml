apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.worker.name }}
  name: {{ .Values.worker.name }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
    spec:
      containers:
      - image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        name: {{ .Values.worker.name }}
