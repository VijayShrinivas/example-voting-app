apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: dockersamples/examplevotingapp_worker

  strategy:
    blueGreen:
      activeService: worker-active
      previewService: worker-preview
      autoPromotionEnabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: worker-active
spec:
  selector:
    app: worker
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: worker-preview
spec:
  selector:
    app: worker
  ports:
  - port: 80
