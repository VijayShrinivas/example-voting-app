apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - name: result
        image: dockersamples/examplevotingapp_result
        ports:
        - containerPort: 80

  strategy:
    blueGreen:
      activeService: result-active
      previewService: result-preview
      autoPromotionEnabled: false
